<header class="header">
  <mat-toolbar color="primary" class="nav">
    <div class="brand">
      <mat-icon>person</mat-icon>
      {{ appTitle | titlePrefix:'Developer' | titlecase }}
    </div>

    <span class="spacer"></span>

    <a
      mat-button
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      appHoverHighlight
    >
      {{ 'home' | titlecase }}
    </a>

    <a
      mat-button
      routerLink="/projects"
      routerLinkActive="active"
      appHoverHighlight
    >
      {{ 'projects' | titlecase }}
    </a>

    <a
      mat-button
      routerLink="/experience"
      routerLinkActive="active"
      appHoverHighlight
    >
      {{ 'experience' | titlecase }}
    </a>

    <a
      mat-button
      routerLink="/resume"
      routerLinkActive="active"
      appHoverHighlight
    >
      {{ 'resume' | titlecase }}
    </a>

    <a
      mat-button
      routerLink="/contact"
      routerLinkActive="active"
      appHoverHighlight
    >
      {{ 'contact' | titlecase }}
    </a>
  </mat-toolbar>
</header>

<main class="main">
  <router-outlet></router-outlet>
</main>

<footer>
  © {{ currentYear }} {{ appTitle }} · Last updated
  {{ today | date : 'longDate' }}
</footer>
